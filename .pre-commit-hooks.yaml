- id: strayguard
  name: strayguard
  description: Flag new files that do not belong in the repository, with TypeSafe Jev.
  entry: strayguard check
  language: python
  pass_filenames: false
  always_run: true
  require_serial: true
  verbose: true
  stages: [pre-commit]
  minimum_pre_commit_version: "3.2.0"
